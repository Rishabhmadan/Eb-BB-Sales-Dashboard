name: Sync Odoo CRM Data

on:
  schedule:
    # Runs every 2 hours. You can adjust this schedule (in UTC time)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows you to trigger it manually from the GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Run Odoo Sync Script
      env:
        ODOO_URL: ${{ secrets.ODOO_URL }}
        ODOO_DB: ${{ secrets.ODOO_DB }}
        ODOO_USER: ${{ secrets.ODOO_USER }}
        ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
      run: |
        python sync_odoo.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add leads_data.json
        if git status --porcelain | grep -q "leads_data.json"; then
          git commit -m "data: automatic update from Odoo crm.lead (GitHub Actions)"
          git push origin main
        else
          echo "No changes detected in Odoo CRM data."
        fi
